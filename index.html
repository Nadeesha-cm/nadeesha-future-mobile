<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Future Mobile Diyawiddagama – Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#241b4b; --muted:#7a729c; --bg:#f6f2ff; --card:#ffffff; --line:#ece6ff;
  --violet:#7c4dff; --pink:#ff4f9a; --orange:#ff9a3c; --teal:#14c8b0; --blue:#2f8cff; --red:#ff5468; --green:#22c55e; --yellow:#ffc933;
  --g1:linear-gradient(135deg,#7c4dff,#b44dff);
  --g2:linear-gradient(135deg,#ff4f9a,#ff8a5c);
  --g3:linear-gradient(135deg,#14c8b0,#2f8cff);
  --g4:linear-gradient(135deg,#ff9a3c,#ffc933);
  --g5:linear-gradient(135deg,#2f8cff,#7c4dff);
  --g6:linear-gradient(135deg,#ff5468,#ff4f9a);
  --r:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:'Nunito',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;color:var(--ink);background:
  radial-gradient(900px 500px at 100% -10%,#ffd9ec 0,transparent 60%),
  radial-gradient(800px 500px at -10% 10%,#d6e6ff 0,transparent 60%),
  radial-gradient(700px 500px at 60% 110%,#d5fff3 0,transparent 60%),var(--bg);
  min-height:100vh}
h1,h2,h3{font-family:'Baloo 2','Nunito',system-ui,sans-serif;line-height:1.1}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

.app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}
aside{position:sticky;top:0;height:100vh;padding:22px 16px;background:linear-gradient(180deg,#3a1d8f 0%,#6a2fd6 55%,#c43fb5 100%);color:#fff;display:flex;flex-direction:column;gap:8px;overflow:auto}
.brand{display:flex;align-items:center;gap:12px;padding:6px 10px 18px}
.brand .logo{width:46px;height:46px;border-radius:15px;background:var(--g4);display:grid;place-items:center;font-size:24px;box-shadow:0 8px 20px rgba(0,0,0,.25);transform:rotate(-6deg)}
.brand h1{font-size:18px;font-weight:800;line-height:1.15}
.brand small{display:block;opacity:.75;font-size:12px;font-weight:600}
nav{display:flex;flex-direction:column;gap:6px}
nav button{display:flex;align-items:center;gap:12px;background:transparent;color:#fff;padding:12px 14px;border-radius:16px;font-weight:700;font-size:15px;text-align:left;transition:background .15s,transform .15s}
nav button .ic{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:18px;background:rgba(255,255,255,.16)}
nav button:hover{background:rgba(255,255,255,.12)}
nav button.on{background:#fff;color:var(--violet)}
nav button.on .ic{background:var(--g1);color:#fff}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.side-foot button{background:rgba(255,255,255,.14);color:#fff;padding:11px 14px;border-radius:14px;font-weight:700;font-size:14px}
.side-foot button:hover{background:rgba(255,255,255,.24)}

main{padding:28px clamp(16px,3vw,36px) 60px;max-width:1280px;width:100%}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin-bottom:22px}
.top h2{font-size:clamp(26px,4vw,38px);font-weight:800}
.top p{color:var(--muted);font-weight:600;margin-top:2px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
.btn{padding:12px 18px;border-radius:15px;font-weight:800;font-size:14.5px;color:#fff;background:var(--g1);box-shadow:0 8px 18px rgba(124,77,255,.28);transition:transform .12s,box-shadow .12s}
.btn:hover{transform:translateY(-2px)}
.btn:active{transform:translateY(0)}
.btn.pink{background:var(--g2);box-shadow:0 8px 18px rgba(255,79,154,.28)}
.btn.teal{background:var(--g3);box-shadow:0 8px 18px rgba(20,200,176,.28)}
.btn.orange{background:var(--g4);color:#4a2b00;box-shadow:0 8px 18px rgba(255,154,60,.3)}
.btn.ghost{background:#fff;color:var(--violet);box-shadow:none;border:2px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px;border-radius:11px;box-shadow:none}
.btn.red{background:var(--g6);box-shadow:none}

.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:22px}
.stat{position:relative;overflow:hidden;border-radius:var(--r);padding:20px;color:#fff;min-height:128px;box-shadow:0 14px 30px rgba(36,27,75,.14)}
.stat::after{content:"";position:absolute;right:-30px;top:-30px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.18)}
.stat::before{content:"";position:absolute;right:30px;bottom:-40px;width:90px;height:90px;border-radius:50%;background:rgba(255,255,255,.12)}
.stat .em{font-size:26px}
.stat .lb{font-weight:700;opacity:.92;font-size:14px;margin-top:6px}
.stat .v{font-family:'Baloo 2',sans-serif;font-size:clamp(22px,2.4vw,30px);font-weight:800;margin-top:2px;position:relative;z-index:1}
.s1{background:var(--g1)}.s2{background:var(--g3)}.s3{background:var(--g2)}.s4{background:var(--g4);color:#4a2b00}.s5{background:var(--g5)}.s6{background:var(--g6)}

.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:18px}
.panel{background:var(--card);border-radius:var(--r);padding:20px;box-shadow:0 10px 28px rgba(36,27,75,.07);border:2px solid #fff}
.panel h3{font-size:20px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.legend{display:flex;gap:14px;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:4px}
.legend i{display:inline-block;width:11px;height:11px;border-radius:4px;margin-right:6px;vertical-align:-1px}

.toolbar{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px}
.toolbar input,.toolbar select{padding:11px 14px;border-radius:14px;border:2px solid var(--line);background:#fff;min-width:150px;font-weight:600}
.toolbar input[type=search]{flex:1;min-width:200px}
.tablewrap{overflow-x:auto;border-radius:var(--r);background:#fff;box-shadow:0 10px 28px rgba(36,27,75,.07)}
table{width:100%;border-collapse:collapse;min-width:720px}
th{background:linear-gradient(90deg,#efe8ff,#ffe8f3);text-align:left;padding:13px 14px;font-size:13px;font-weight:800;color:#5b3fc4}
td{padding:12px 14px;border-top:1px solid var(--line);font-weight:600;font-size:14.5px;vertical-align:middle}
tr:hover td{background:#faf7ff}
td.num,th.num{text-align:right;white-space:nowrap}
.pill{display:inline-block;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:800}
.p-v{background:#ece5ff;color:#5b3fc4}.p-g{background:#d9f8ec;color:#0c8a5c}.p-r{background:#ffe1e5;color:#c2263d}.p-o{background:#ffecd2;color:#a85a00}.p-b{background:#dcebff;color:#1c62c9}.p-p{background:#ffe0ef;color:#c4156b}
.thumb{width:42px;height:42px;border-radius:11px;object-fit:cover;cursor:zoom-in;border:2px solid var(--line);background:#f1ecff}
.noimg{color:#c0b8e0;font-size:13px}
.rowact{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.empty{padding:44px 20px;text-align:center;color:var(--muted);font-weight:700}
.empty .big{font-size:44px;margin-bottom:8px}
.pos{color:#0c8a5c}.neg{color:#c2263d}
.list .item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px dashed var(--line)}
.list .item:first-child{border-top:0}
.list .dot{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-size:18px;flex:none}
.list .meta{flex:1;min-width:0}
.list .meta b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.list .meta span{font-size:12.5px;color:var(--muted);font-weight:600}
.list .amt{font-weight:800;white-space:nowrap}

.overlay{position:fixed;inset:0;background:rgba(36,27,75,.55);backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.overlay.hidden{display:none}
.modal{background:#fff;border-radius:26px;width:min(560px,100%);max-height:94vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.35);animation:pop .18s ease-out}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.modal h3{font-size:25px;font-weight:800;margin-bottom:14px}
.modal .hd{height:8px;border-radius:99px;margin:-8px 0 16px;background:linear-gradient(90deg,var(--violet),var(--pink),var(--orange),var(--teal))}
.f{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.f .full{grid-column:1/-1}
label{display:block;font-size:13px;font-weight:800;color:#5b3fc4;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;padding:11px 13px;border-radius:13px;border:2px solid var(--line);background:#fcfbff;font-weight:600}
.f input:focus,.f select:focus,.f textarea:focus{border-color:var(--violet);outline:0}
.chk{display:flex;align-items:center;gap:9px;font-weight:700;font-size:14px;padding:6px 0}
.chk input{width:20px;height:20px;accent-color:var(--violet)}
.drop{border:2.5px dashed #cdbdff;border-radius:16px;padding:14px;text-align:center;background:#faf7ff;cursor:pointer;font-weight:700;color:var(--violet)}
.drop:hover{background:#f1eaff}
.drop img{max-width:100%;max-height:160px;border-radius:12px;margin-top:8px;display:block;margin-inline:auto}
.total{grid-column:1/-1;padding:12px 14px;border-radius:14px;background:linear-gradient(90deg,#ece5ff,#ffe6f2);font-weight:800;display:flex;justify-content:space-between}
.mfoot{display:flex;justify-content:flex-end;gap:10px;margin-top:18px}
.qrbox{display:grid;place-items:center;gap:10px;text-align:center}
.qrbox .frame{padding:16px;border-radius:22px;background:linear-gradient(135deg,#7c4dff,#ff4f9a,#ff9a3c);display:inline-block}
.qrbox .inner{background:#fff;padding:12px;border-radius:14px}
.qrbox code{font-size:12px;color:var(--muted);word-break:break-all}
#lightbox img{max-width:min(94vw,900px);max-height:90vh;border-radius:18px;background:#fff}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#241b4b;color:#fff;padding:12px 20px;border-radius:14px;font-weight:700;z-index:99;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.warn{background:#fff3d6;color:#8a5a00;padding:10px 14px;border-radius:12px;font-weight:700;font-size:13.5px;margin-bottom:14px}

.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.tabs button{padding:10px 16px;border-radius:14px;background:#fff;color:var(--violet);font-weight:800;border:2px solid var(--line)}
.tabs button.on{background:var(--g1);color:#fff;border-color:transparent;box-shadow:0 8px 18px rgba(124,77,255,.28)}
.jcard{background:#fff;border-radius:18px;padding:14px 16px;margin-bottom:12px;box-shadow:0 8px 22px rgba(36,27,75,.06);border-left:6px solid var(--violet)}
.jcard .jh{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:6px}
.jcard .jh .memo{flex:1;font-weight:700;color:var(--muted);min-width:140px}
.jcard table{min-width:0}
.jcard td{padding:6px 8px;font-size:14px}
.jcard td.ind{padding-left:34px;color:#5b3fc4}
.jrow{display:grid;grid-template-columns:1fr 100px 100px 40px;gap:8px;margin-bottom:8px;align-items:center}
.jrow select,.jrow input{padding:10px;border-radius:12px;border:2px solid var(--line);width:100%;background:#fcfbff}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-radius:14px;font-weight:800;margin-top:8px;background:linear-gradient(90deg,#ece5ff,#ffe6f2)}
.ok{background:#d9f8ec;color:#0c8a5c;padding:10px 14px;border-radius:12px;font-weight:800;margin-top:12px}
.bad{background:#ffe1e5;color:#c2263d;padding:10px 14px;border-radius:12px;font-weight:800;margin-top:12px}
.sec{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:15px;color:#5b3fc4;margin:12px 0 2px}
.quote{position:relative;display:flex;align-items:center;gap:16px;border-radius:var(--r);padding:22px 26px;margin-bottom:20px;color:#fff;background:linear-gradient(120deg,#7c4dff 0%,#c43fb5 55%,#ff8a5c 100%);box-shadow:0 14px 30px rgba(124,77,255,.25);overflow:hidden}
.quote::after{content:"";position:absolute;right:-40px;bottom:-60px;width:180px;height:180px;border-radius:50%;background:rgba(255,255,255,.13)}
.qmark{font-family:'Baloo 2',serif;font-size:84px;line-height:.7;font-weight:800;opacity:.5;align-self:flex-start;margin-top:10px}
.qbody{flex:1;position:relative;z-index:1}
.qtext{font-family:'Baloo 2','Nunito',sans-serif;font-size:clamp(19px,2.4vw,27px);font-weight:700;line-height:1.25;transition:opacity .4s}
.qauth{margin-top:6px;font-weight:700;opacity:.9;transition:opacity .4s}
.qnext{position:relative;z-index:1;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.22);color:#fff;font-size:20px;font-weight:800;flex:none}
.qnext:hover{background:rgba(255,255,255,.36)}
@media (max-width:900px){
  .app{grid-template-columns:1fr}
  aside{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:12px;gap:8px}
  .brand{padding:0 6px 0 0}.brand small{display:none}
  nav{flex-direction:row;flex-wrap:wrap}
  nav button{padding:8px 10px;font-size:13.5px}
  nav button .ic{width:26px;height:26px;font-size:14px}
  .side-foot{margin:0;flex-direction:row}
  .grid2{grid-template-columns:1fr}
}
@media (max-width:520px){.f{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand">
      <div class="logo">📱</div>
      <div><h1 id="brandName">Future Mobile</h1><small>Stock &amp; money manager</small></div>
    </div>
    <nav id="nav">
      <button data-v="dash"><span class="ic">🏠</span>Dashboard</button>
      <button data-v="stock"><span class="ic">📦</span>Stock</button>
      <button data-v="income"><span class="ic">💰</span>Income</button>
      <button data-v="expense"><span class="ic">🧾</span>Expenses</button>
      <button data-v="reload"><span class="ic">📲</span>Reload</button>
      <button data-v="recv"><span class="ic">🤝</span>Receivable</button>
      <button data-v="pay"><span class="ic">📒</span>Payable</button>
      <button data-v="acct"><span class="ic">📚</span>Accounts</button>
    </nav>
    <div class="side-foot">
      <button onclick="openSettings()">⚙️ Settings</button>
      <button onclick="exportExcel()">📊 Export to Excel</button>
      <button onclick="exportBackup()">⬇️ Backup data</button>
      <button onclick="document.getElementById('restoreFile').click()">⬆️ Restore backup</button>
      <input type="file" id="restoreFile" accept="application/json" hidden>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="modal" class="overlay hidden"><div class="modal" id="modalBody"></div></div>
<div id="lightbox" class="overlay hidden" onclick="this.classList.add('hidden')"><img id="lbImg" alt="Bill"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script>
/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayStr = () => new Date(Date.now() - new Date().getTimezoneOffset() * 60000).toISOString().slice(0, 10);
const cur = () => state.settings.currency || 'Rs.';
const money = n => cur() + ' ' + Number(n || 0).toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2});
const sum = (arr, f) => arr.reduce((a, x) => a + (+f(x) || 0), 0);
function toast(msg) {
  document.querySelectorAll('.toast').forEach(t => t.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

/* ---------- storage (IndexedDB, falls back to memory) ---------- */
let db = null, dbOk = true;
const memKV = {}, memImg = {};
function openDB() {
  return new Promise(res => {
    try {
      const r = indexedDB.open('phoneshop-manager', 1);
      r.onupgradeneeded = () => { r.result.createObjectStore('kv'); r.result.createObjectStore('img'); };
      r.onsuccess = () => { db = r.result; res(); };
      r.onerror = () => { dbOk = false; res(); };
    } catch (e) { dbOk = false; res(); }
  });
}
function idb(store, mode, fn) {
  return new Promise(res => {
    if (!db) return res(null);
    try {
      const tx = db.transaction(store, mode); const out = fn(tx.objectStore(store));
      tx.oncomplete = () => res(out && 'result' in out ? out.result : null);
      tx.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
const idbGet = (s, k) => db ? idb(s, 'readonly', st => st.get(k)) : Promise.resolve((s === 'kv' ? memKV : memImg)[k] ?? null);
const idbSet = (s, k, v) => db ? idb(s, 'readwrite', st => st.put(v, k)) : Promise.resolve(((s === 'kv' ? memKV : memImg)[k] = v));
const idbDel = (s, k) => db ? idb(s, 'readwrite', st => st.delete(k)) : Promise.resolve(delete (s === 'kv' ? memKV : memImg)[k]);

let state = {
  products: [], sales: [], expenses: [], settle: [], journal: [], rl: {cos: [], buys: [], sells: []}, names: {}, custom: [],
  settings: {shop: 'Future Mobile Diyawiddagama', currency: 'Rs.', lowStock: 5, delPw: 'Trust'}
};
const save = () => idbSet('kv', 'state', state);

/* ---------- images ---------- */
const imgCache = {};
async function getImg(id) { if (!id) return null; if (imgCache[id]) return imgCache[id]; const v = await idbGet('img', id); if (v) imgCache[id] = v; return v; }
async function putImg(dataUrl) { const id = uid(); imgCache[id] = dataUrl; await idbSet('img', id, dataUrl); return id; }
function imgInUse(id) { return state.products.some(p => p.img === id) || state.sales.some(s => s.img === id) || state.expenses.some(e => e.img === id) || state.rl.buys.some(b => b.img === id); }
async function dropImg(id) { if (id && !imgInUse(id)) { delete imgCache[id]; await idbDel('img', id); } }
function compress(file, max = 1000, q = 0.72) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = rej;
    fr.onload = () => {
      const im = new Image();
      im.onerror = rej;
      im.onload = () => {
        const k = Math.min(1, max / Math.max(im.width, im.height));
        const c = document.createElement('canvas'); c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(im, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', q));
      };
      im.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}
function hydrate() {
  document.querySelectorAll('img[data-img]').forEach(async el => { const s = await getImg(el.dataset.img); if (s) el.src = s; });
}
const thumb = id => id ? `<img class="thumb" data-img="${id}" alt="Bill" onclick="showImg('${id}')">` : `<span class="noimg">No bill</span>`;
async function showImg(id) { const s = await getImg(id); if (!s) return; $('#lbImg').src = s; $('#lightbox').classList.remove('hidden'); }

let pending = null, pendingChanged = false;
function billField(existingId) {
  pending = null; pendingChanged = false;
  return `<div class="full"><label>Bill / receipt photo</label>
    <label class="drop" for="billFile" style="display:block;margin:0">📷 Tap to add or take a photo
      <div id="billPrev">${existingId ? `<img data-img="${existingId}" alt="Bill">` : ''}</div>
    </label>
    <input type="file" id="billFile" accept="image/*" hidden onchange="onBill(this)"></div>`;
}
async function onBill(inp) {
  const f = inp.files[0]; if (!f) return;
  try { pending = await compress(f); pendingChanged = true; $('#billPrev').innerHTML = `<img src="${pending}" alt="Bill">`; }
  catch (e) { toast('Could not read that image'); }
}
async function takeBill(oldId) {
  if (!pendingChanged) return oldId || null;
  const id = pending ? await putImg(pending) : null;
  return id;
}

/* ---------- modal ---------- */
function openModal(html) { $('#modalBody').innerHTML = `<div class="hd"></div>` + html; $('#modal').classList.remove('hidden'); hydrate(); }
function closeModal() { $('#modal').classList.add('hidden'); }
$('#modal').addEventListener('mousedown', e => { if (e.target.id === 'modal') closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') { closeModal(); $('#lightbox').classList.add('hidden'); } });
const val = id => $('#' + id).value;

/* ---------- QR ---------- */
function openQR(text, title, sub) {
  openModal(`<h3>${esc(title)}</h3><div class="qrbox"><div class="frame"><div class="inner" id="qrTarget"></div></div>
    <div style="font-weight:700">${esc(sub || '')}</div><code>${esc(text)}</code></div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Close</button>
    <button class="btn teal" onclick="downloadQR()">Download</button>
    <button class="btn" onclick="printQR()">Print label</button></div>`);
  const t = $('#qrTarget');
  if (typeof QRCode === 'undefined') { t.innerHTML = '<div class="warn">QR needs internet the first time the page loads. Connect and reload.</div>'; return; }
  new QRCode(t, {text, width: 220, height: 220, correctLevel: QRCode.CorrectLevel.M});
}
function qrDataUrl() { const c = document.querySelector('#qrTarget canvas'); if (c) return c.toDataURL('image/png'); const i = document.querySelector('#qrTarget img'); return i ? i.src : null; }
function downloadQR() { const u = qrDataUrl(); if (!u) return; const a = document.createElement('a'); a.href = u; a.download = 'qr-' + ($('#modalBody h3').textContent || 'code').replace(/\W+/g, '-') + '.png'; a.click(); }
function printQR() {
  const u = qrDataUrl(); if (!u) return;
  const w = window.open('', '_blank'); if (!w) return toast('Allow pop-ups to print');
  w.document.write(`<html><body style="font-family:sans-serif;text-align:center;padding:20px"><h3>${esc($('#modalBody h3').textContent)}</h3><img src="${u}" width="220"><p>${esc($('#modalBody .qrbox div:nth-child(2)').textContent)}</p><script>onload=()=>print()<\/script></body></html>`);
  w.document.close();
}

/* ---------- accounting core (double entry) ---------- */
const FIXED = [
  {id: 'cash', code: '1000', name: 'Cash in Hand', type: 'asset'},
  {id: 'petty', code: '1005', name: 'Petty Cash', type: 'asset'},
  {id: 'bank', code: '1010', name: 'Bank', type: 'asset'},
  {id: 'ar', code: '1100', name: 'Accounts Receivable', type: 'asset'},
  {id: 'inventory', code: '1200', name: 'Inventory (stock)', type: 'asset'},
  {id: 'ap', code: '2000', name: 'Accounts Payable', type: 'liability'},
  {id: 'capital', code: '3000', name: "Owner's Capital", type: 'equity'},
  {id: 'drawings', code: '3100', name: "Owner's Drawings", type: 'draw'},
  {id: 'sales', code: '4000', name: 'Sales – Accessories', type: 'income'},
  {id: 'repair', code: '4100', name: 'Repair Income', type: 'income'},
  {id: 'otherinc', code: '4200', name: 'Other Income', type: 'income'},
  {id: 'cogs', code: '5000', name: 'Cost of Goods Sold', type: 'expense'},
  {id: 'rsales', code: '4300', name: 'Reload Sales', type: 'income'},
  {id: 'rcogs', code: '5100', name: 'Cost of Reload Sold', type: 'expense'}
];
FIXED.forEach(a => a.def = a.name);
function applyNames() { FIXED.forEach(a => a.name = (state.names && state.names[a.id]) || a.def); }
const TYPENAME = {asset: 'Asset', liability: 'Liability', equity: 'Equity', draw: 'Equity', income: 'Income', expense: 'Expense'};
const TYPEPILL = {asset: 'p-b', liability: 'p-o', equity: 'p-v', draw: 'p-v', income: 'p-g', expense: 'p-p'};
const PAYL = {cash: 'Cash in hand', petty: 'Petty cash', bank: 'Bank', credit: 'On credit', owner: "Owner's money"};
const SRC = {sale: ['Sale', 'p-g'], expense: ['Expense', 'p-p'], receipt: ['Received', 'p-b'], payment: ['Paid', 'p-o'], reload: ['Reload', 'p-b'], manual: ['Manual', 'p-v']};
const isDebitNormal = t => t === 'asset' || t === 'expense' || t === 'draw';
function accounts() {
  const cats = [...new Set([...ECATS.filter(c => c !== 'Stock purchase'), ...state.expenses.map(e => e.category).filter(c => c && c !== 'Stock purchase')])];
  return [...FIXED, ...(state.custom || []).map((c, i) => ({id: c.id, code: String(7000 + i * 10), name: c.name, type: c.type})), ...state.rl.cos.map((c, i) => ({id: 'rl:' + c.id, code: String(1300 + i), name: 'Reload float – ' + c.name, type: 'asset'})), ...cats.map((c, i) => ({id: 'x:' + c, code: String(6000 + i * 10), name: c, type: 'expense'}))];
}
const acctById = id => accounts().find(a => a.id === id) || {id, code: '----', name: id, type: 'expense'};
const settledFor = id => sum(state.settle.filter(t => t.ref === id), t => t.amount);

function buildJournal() {
  const J = [];
  const add = (date, memo, src, ref, lines) => J.push({id: src + ':' + ref, date, memo, src, ref, lines: lines.filter(l => l.dr || l.cr)});
  state.sales.forEach(s => {
    const pay = s.pay || 'cash', dr = pay === 'credit' ? 'ar' : pay;
    const cr = s.type === 'sale' ? 'sales' : s.type === 'repair' ? 'repair' : 'otherinc';
    const L = [{a: dr, dr: s.total, cr: 0}, {a: cr, dr: 0, cr: s.total}];
    if (s.type === 'sale' && s.cost > 0) L.push({a: 'cogs', dr: s.cost, cr: 0}, {a: 'inventory', dr: 0, cr: s.cost});
    add(s.date, 'Sale: ' + s.name + (s.party ? ' – ' + s.party : ''), 'sale', s.id, L);
  });
  state.expenses.forEach(e => {
    const pay = e.pay || 'cash';
    const dr = e.category === 'Stock purchase' ? 'inventory' : 'x:' + e.category;
    const cr = pay === 'credit' ? 'ap' : pay === 'owner' ? 'capital' : pay;
    add(e.date, e.title + (e.party ? ' – ' + e.party : ''), 'expense', e.id, [{a: dr, dr: e.amount, cr: 0}, {a: cr, dr: 0, cr: e.amount}]);
  });
  state.settle.forEach(t => {
    if (t.kind === 'receipt') add(t.date, 'Received from ' + (t.party || 'customer') + (t.note ? ' – ' + t.note : ''), 'receipt', t.id, [{a: t.method, dr: t.amount, cr: 0}, {a: 'ar', dr: 0, cr: t.amount}]);
    else add(t.date, 'Paid to ' + (t.party || 'supplier') + (t.note ? ' – ' + t.note : ''), 'payment', t.id, [{a: 'ap', dr: t.amount, cr: 0}, {a: t.method, dr: 0, cr: t.amount}]);
  });
  state.journal.forEach(j => add(j.date, j.memo, 'manual', j.id, j.lines.map(l => ({a: l.a, dr: +l.dr || 0, cr: +l.cr || 0}))));
  state.rl.buys.forEach(b => add(b.date, 'Reload stock: ' + coName(b.co), 'reload', b.id, [{a: 'rl:' + b.co, dr: b.paid, cr: 0}, {a: b.pay === 'owner' ? 'capital' : b.pay, dr: 0, cr: b.paid}]));
  state.rl.sells.forEach(x => add(x.date, 'Reload sale: ' + coName(x.co) + (x.number ? ' ' + x.number : ''), 'reload', x.id, [{a: x.pay === 'credit' ? 'ar' : x.pay, dr: x.amount, cr: 0}, {a: 'rsales', dr: 0, cr: x.amount}, {a: 'rcogs', dr: x.cost, cr: 0}, {a: 'rl:' + x.co, dr: 0, cr: x.cost}]));
  return J.sort((a, b) => a.date.localeCompare(b.date) || a.id.localeCompare(b.id));
}
function balances(to, from) {
  const B = {};
  buildJournal().forEach(j => {
    if (to && j.date > to) return; if (from && j.date < from) return;
    j.lines.forEach(l => { const b = B[l.a] || (B[l.a] = {dr: 0, cr: 0}); b.dr += l.dr; b.cr += l.cr; });
  });
  return B;
}
function bal(B, a) { const x = B[a.id] || {dr: 0, cr: 0}; return isDebitNormal(a.type) ? x.dr - x.cr : x.cr - x.dr; }
function balCards() {
  const B = balances(), g = id => bal(B, acctById(id)); let cin = 0, cout = 0, pin = 0, pout = 0;
  buildJournal().forEach(j => { if (j.date === todayStr()) j.lines.forEach(l => { if (l.a === 'cash') { cin += l.dr; cout += l.cr; } else if (l.a === 'petty') { pin += l.dr; pout += l.cr; } }); });
  return `<div class="cards">
    <div class="stat s2"><div class="em">💵</div><div class="lb">${esc(acctById('cash').name)}</div><div class="v">${money(g('cash'))}</div><div class="lb" style="font-size:12px;margin-top:2px;position:relative;z-index:1">In ${money(cin)} · Out ${money(cout)} today</div></div>
    <div class="stat s4"><div class="em">🧰</div><div class="lb">${esc(acctById('petty').name)}</div><div class="v">${money(g('petty'))}</div><div class="lb" style="font-size:12px;margin-top:2px;position:relative;z-index:1">In ${money(pin)} · Spent ${money(pout)} today</div></div>
    <div class="stat s5"><div class="em">🏦</div><div class="lb">${esc(acctById('bank').name)}</div><div class="v">${money(g('bank'))}</div></div>
    <div class="stat s4"><div class="em">🤝</div><div class="lb">Customers owe you</div><div class="v">${money(g('ar'))}</div></div>
    <div class="stat s3"><div class="em">📒</div><div class="lb">You owe suppliers</div><div class="v">${money(g('ap'))}</div></div>
    <div class="stat s1"><div class="em">📲</div><div class="lb">Reload balance (at cost)</div><div class="v">${money(sum(state.rl.cos, c => g('rl:' + c.id)))}</div></div>
  </div>`;
}
function payBlock(pre, kind) {
  const opts = kind === 'sale'
    ? [['cash', 'Cash in hand'], ['bank', 'Bank'], ['credit', 'On credit (customer pays later)']]
    : [['cash', 'Cash in hand'], ['bank', 'Bank'], ['petty', 'Petty cash'], ['credit', 'On credit (pay supplier later)'], ['owner', kind === 'stock' ? "Owner's money / opening stock" : "Owner's own money"]];
  return `<div class="full"><label>${kind === 'sale' ? 'Money received in' : 'Paid from'}</label><select id="${pre}_pay" onchange="payToggle('${pre}')">${opts.map(o => `<option value="${o[0]}">${o[1]}</option>`).join('')}</select></div>
  <div class="full" id="${pre}_pwrap" style="display:none"><label>${kind === 'sale' ? 'Customer name' : 'Supplier name'}</label><input id="${pre}_party" placeholder="Required for credit"></div>`;
}
function payToggle(pre) { $('#' + pre + '_pwrap').style.display = val(pre + '_pay') === 'credit' ? '' : 'none'; }
function payPill(x, total) {
  const p = x.pay || 'cash';
  if (p === 'credit') { const due = total - settledFor(x.id); return due > 0.004 ? `<span class="pill p-o">Credit · ${money(due)} due</span>` : `<span class="pill p-g">Credit · settled</span>`; }
  return `<span class="pill ${p === 'bank' ? 'p-b' : p === 'owner' ? 'p-v' : 'p-g'}">${PAYL[p]}</span>`;
}

/* ---------- dashboard ---------- */
function dayTotals(n) {
  const out = [];
  for (let i = n - 1; i >= 0; i--) {
    const d = new Date(Date.now() - new Date().getTimezoneOffset() * 60000 - i * 864e5).toISOString().slice(0, 10);
    out.push({d, inc: sum(state.sales.filter(s => s.date === d), s => s.total), exp: sum(state.expenses.filter(e => e.date === d), e => e.amount)});
  }
  return out;
}
function chart() {
  const data = dayTotals(7), max = Math.max(1, ...data.flatMap(x => [x.inc, x.exp]));
  const W = 560, H = 220, base = 190, bw = 22;
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Income and expenses for the last 7 days">`;
  [0.25, 0.5, 0.75, 1].forEach(f => { const y = base - f * 160; s += `<line x1="10" x2="${W - 10}" y1="${y}" y2="${y}" stroke="#ece6ff" stroke-dasharray="4 5"/>`; });
  data.forEach((x, i) => {
    const cx = 40 + i * 76, hi = x.inc / max * 160, he = x.exp / max * 160;
    s += `<rect x="${cx - bw - 2}" y="${base - hi}" width="${bw}" height="${Math.max(hi, 2)}" rx="7" fill="#14c8b0"><title>Income ${money(x.inc)}</title></rect>`;
    s += `<rect x="${cx + 2}" y="${base - he}" width="${bw}" height="${Math.max(he, 2)}" rx="7" fill="#ff4f9a"><title>Expenses ${money(x.exp)}</title></rect>`;
    s += `<text x="${cx}" y="${base + 22}" text-anchor="middle" font-size="12" font-weight="700" fill="#7a729c">${x.d.slice(5)}</text>`;
  });
  return s + '</svg>';
}
function vDash() {
  const m = todayStr().slice(0, 7), t = todayStr();
  const incM = sum(state.sales.filter(s => s.date.startsWith(m)), s => s.total);
  const expM = sum(state.expenses.filter(e => e.date.startsWith(m)), e => e.amount);
  const incT = sum(state.sales.filter(s => s.date === t), s => s.total);
  const profitM = sum(state.sales.filter(s => s.date.startsWith(m)), s => s.total - s.cost);
  const stockVal = sum(state.products, p => p.qty * p.cost);
  const low = state.products.filter(p => p.qty <= state.settings.lowStock);
  const recent = [...state.sales.map(s => ({...s, k: 'in', t: s.name, a: s.total})), ...state.expenses.map(e => ({...e, k: 'out', t: e.title, a: e.amount}))]
    .sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id)).slice(0, 7);
  return `
  <div class="top"><div><h2>Hello, ${esc(state.settings.shop)} 👋</h2><p>Here is how the shop is doing today.</p></div>
    <div class="actions"><button class="btn teal" onclick="openSale()">+ New sale</button><button class="btn pink" onclick="openExpense()">+ Expense</button><button class="btn orange" onclick="exportExcel()">📊 Excel</button><button class="btn" onclick="openProduct()">+ Add item</button></div></div>
  ${quoteCard()}
  ${balCards()}
  <div class="cards">
    <div class="stat s1"><div class="em">📲</div><div class="lb">Reload margin today</div><div class="v">${money(sum(state.rl.sells.filter(x => x.date === t), x => x.amount - x.cost))}</div></div>
    <div class="stat s2"><div class="em">💵</div><div class="lb">Income today</div><div class="v">${money(incT)}</div></div>
    <div class="stat s1"><div class="em">📈</div><div class="lb">Income this month</div><div class="v">${money(incM)}</div></div>
    <div class="stat s3"><div class="em">🧾</div><div class="lb">Expenses this month</div><div class="v">${money(expM)}</div></div>
    <div class="stat s5"><div class="em">🏦</div><div class="lb">Money left (income − expenses)</div><div class="v">${money(incM - expM)}</div></div>
    <div class="stat s4"><div class="em">✨</div><div class="lb">Profit on sales this month</div><div class="v">${money(profitM)}</div></div>
    <div class="stat s6"><div class="em">📦</div><div class="lb">Stock value (at cost)</div><div class="v">${money(stockVal)}</div></div>
  </div>
  <div class="grid2">
    <div class="panel"><h3>🗓️ Last 7 days</h3>
      <div class="legend"><span><i style="background:#14c8b0"></i>Income</span><span><i style="background:#ff4f9a"></i>Expenses</span></div>${chart()}</div>
    <div class="panel"><h3>⚠️ Running low (${low.length})</h3>
      ${low.length ? `<div class="list">${low.slice(0, 7).map(p => `<div class="item"><div class="dot" style="background:#ffe1e5">📦</div><div class="meta"><b>${esc(p.name)}</b><span>${esc(p.category || '')}</span></div><div class="amt ${p.qty === 0 ? 'neg' : ''}">${p.qty} left</div></div>`).join('')}</div>`
      : `<div class="empty"><div class="big">🎉</div>All items are well stocked.</div>`}</div>
  </div>
  <div class="panel" style="margin-top:18px"><h3>🕒 Recent activity</h3>
    ${recent.length ? `<div class="list">${recent.map(r => `<div class="item"><div class="dot" style="background:${r.k === 'in' ? '#d9f8ec' : '#ffe0ef'}">${r.k === 'in' ? '💰' : '🧾'}</div><div class="meta"><b>${esc(r.t)}</b><span>${r.date}${r.qty > 1 ? ' · qty ' + r.qty : ''}</span></div><div class="amt ${r.k === 'in' ? 'pos' : 'neg'}">${r.k === 'in' ? '+' : '−'} ${money(r.a)}</div></div>`).join('')}</div>`
    : `<div class="empty"><div class="big">🚀</div>Nothing yet. Add your first item or record a sale to get started.</div>`}</div>`;
}

/* ---------- stock ---------- */
const CATS = ['Phone case', 'Screen protector', 'Charger', 'Cable', 'Earphones', 'Power bank', 'Memory card', 'Spare part', 'Phone', 'Other'];
const catColor = c => ['p-v', 'p-p', 'p-b', 'p-o', 'p-g'][[...(c || 'x')].reduce((a, ch) => a + ch.charCodeAt(0), 0) % 5];
function vStock() {
  const q = ui.q.toLowerCase();
  const cats = [...new Set(state.products.map(p => p.category).filter(Boolean))].sort();
  let list = state.products.filter(p => (!q || (p.name + p.sku + (p.category || '')).toLowerCase().includes(q)) && (!ui.cat || p.category === ui.cat) && (!ui.low || p.qty <= state.settings.lowStock));

  <div id="stockBody">${stockTable(list)}</div>`;
}
function vStockBody() { const q = ui.q.toLowerCase(); const list = state.products.filter(p => (!q || (p.name + p.sku + (p.category || '')).toLowerCase().includes(q)) && (!ui.cat || p.category === ui.cat) && (!ui.low || p.qty <= state.settings.lowStock)).sort((a, b) => a.name.localeCompare(b.name)); $('#stockBody').innerHTML = stockTable(list); hydrate(); }
function keepFocus(fn) { fn(); }
function stockTable(list) {
  if (!list.length) return `<div class="tablewrap"><div class="empty"><div class="big">📦</div>No items here yet. Press “Add item” to enter your first accessory.</div></div>`;
  return `<div class="tablewrap"><table><thead><tr><th>Item</th><th>Category</th><th class="num">Qty</th><th class="num">Cost</th><th class="num">Sell price</th><th>Added</th><th>Bill</th><th></th></tr></thead><tbody>

    <td><span class="pill ${catColor(p.category)}">${esc(p.category || '—')}</span></td>

    <td><div class="rowact"><button class="btn sm teal" onclick="openRestock('${p.id}')">+ Stock</button><button class="btn sm orange" onclick="qrProduct('${p.id}')">QR</button><button class="btn sm ghost" onclick="openProduct('${p.id}')">Edit</button><button class="btn sm red" onclick="delProduct('${p.id}')">✕</button></div></td></tr>`).join('')}
  </tbody></table></div>`;
}
function qrProduct(id) { const p = state.products.find(x => x.id === id); openQR('SKU:' + p.sku + '|' + p.name.replace(/\|/g, '/') + '|' + p.price, p.name, p.sku + ' · ' + money(p.price)); }
function nextSku() { const n = state.products.length + 1; let s; let i = n; do { s = 'PS-' + String(i++).padStart(4, '0'); } while (state.products.some(p => p.sku === s)); return s; }
function openProduct(id) {
  const p = id ? state.products.find(x => x.id === id) : null;

}
function calcP() { const t = $('#p_tot'); if (t) t.textContent = money((+val('p_qty') || 0) * (+val('p_cost') || 0)); }
async function saveProduct(id) {
  const name = val('p_name').trim(); if (!name) return toast('Please enter the item name');
  const qty = Math.max(0, parseInt(val('p_qty')) || 0), cost = +val('p_cost') || 0, price = +val('p_price') || 0, date = val('p_date') || todayStr();
  const sku = val('p_sku').trim() || nextSku(), category = val('p_cat').trim();

function tbHtml(to) {
  const B = balances(to); let dr = 0, cr = 0;
  const rows = accounts().filter(a => B[a.id] || FIXED.includes(a)).map(a => {
    const x = B[a.id] || {dr: 0, cr: 0}, net = x.dr - x.cr, d = net > 0 ? net : 0, c = net < 0 ? -net : 0; dr += d; cr += c;

  ${state.rl.cos.length ? `<div class="cards">${state.rl.cos.map((c, i) => `<div class="stat ${cls[i % 6]}" style="min-height:100px"><div class="lb" style="margin-top:0">${esc(c.name)} balance</div><div class="v">${money(rlBal(c))}</div><div class="lb" style="font-size:12px;margin-top:2px"><a href="#" onclick="openCompany('${c.id}');return false" style="color:inherit;font-weight:800">rename</a></div></div>`).join('')}</div>`
  : `<div class="tablewrap" style="margin-bottom:16px"><div class="empty"><div class="big">📲</div>Add your reload companies first. Press “+ Company”.</div></div>`}
  <div class="panel"><h3>📤 Reload sales</h3>${sells.length ? `<div class="tablewrap" style="box-shadow:none"><table><thead><tr><th>Date</th><th>Company</th><th>Customer / number</th><th class="num">Company amount</th><th class="num">Customer pays</th><th class="num">Margin</th><th>Paid by</th><th></th></tr></thead><tbody>
  ${sells.map(x => `<tr><td>${x.date}</td><td><b>${esc(coName(x.co))}</b></td><td>${esc(x.party || '')}${x.party && x.number ? '<br>' : ''}<span style="color:var(--muted)">${esc(x.number || (x.party ? '' : '—'))}</span></td><td class="num">${money(x.cost)}</td><td class="num pos"><b>${money(x.amount)}</b></td><td class="num">${money(x.amount - x.cost)}</td><td>${payPill(x, x.amount)}</td><td><div class="rowact"><button class="btn sm ghost" onclick="openRlEdit('${x.id}')">Edit</button><button class="btn sm red" onclick="delRl('sells','${x.id}')">✕</button></div></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No reload sales in this period.</div>'}</div>
  <div class="panel" style="margin-top:18px"><h3>📥 Dealer top-ups</h3>${buys.length ? `<div class="tablewrap" style="box-shadow:none"><table><thead><tr><th>Date</th><th>Company</th><th class="num">Amount</th><th>Paid from</th><th>Bill</th><th></th></tr></thead><tbody>
  ${buys.map(b => `<tr><td>${b.date}</td><td><b>${esc(coName(b.co))}</b></td><td class="num neg"><b>${money(b.paid)}</b></td><td><span class="pill ${b.pay === 'bank' ? 'p-b' : b.pay === 'owner' ? 'p-v' : 'p-g'}">${PAYL[b.pay]}</span></td><td>${thumb(b.img)}</td><td><div class="rowact"><button class="btn sm red" onclick="delRl('buys','${b.id}')">✕</button></div></td></tr>`).join('')}</tbody></table></div>` : '<div class="empty">No top-ups in this period.</div>'}</div>`;
}
function openCompany(id) {
  const c = state.rl.cos.find(x => x.id === id);
  openModal(`<h3>${c ? 'Rename company' : 'Add reload company'}</h3><div class="f"><div class="full"><label>Company name</label><input id="c_name" value="${esc(c?.name)}"></div></div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveCompany('${id || ''}')">Save</button></div>`);
}
async function saveCompany(id) {
  const name = val('c_name').trim(); if (!name) return toast('Enter the company name');
  const c = state.rl.cos.find(x => x.id === id); if (c) c.name = name; else state.rl.cos.push({id: uid(), name, disc: 0});
  await save(); closeModal(); render();
}
const coOpts = () => state.rl.cos.map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');
function openRlBuy() {
  if (!state.rl.cos.length) { toast('Add a reload company first'); return openCompany(); }
  openModal(`<h3>Dealer top-up</h3><p style="margin:-6px 0 12px;font-weight:700;color:var(--muted)">Money out, company balance in, same amount. No margin.</p><div class="f"><div><label>Company</label><select id="rb_co">${coOpts()}</select></div><div><label>Date</label><input id="rb_date" type="date" value="${todayStr()}"></div>
    <div><label>Amount</label><input id="rb_amt" type="number" min="0" step="0.01"></div><div><label>Paid from</label><select id="rb_pay"><option value="cash">Cash in hand</option><option value="petty">Petty cash</option><option value="bank">Bank</option><option value="owner">Owner's own money</option></select></div>
    <div class="full"><label>Note</label><input id="rb_note" placeholder="Optional"></div>${billField(null)}</div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn orange" onclick="saveRlBuy()">Save top-up</button></div>`);
}
async function saveRlBuy() {
  const amt = +val('rb_amt') || 0; if (!(amt > 0)) return toast('Enter the amount');
  const img = await takeBill(null);
  state.rl.buys.push({id: uid(), date: val('rb_date') || todayStr(), co: val('rb_co'), face: amt, paid: amt, pay: val('rb_pay'), note: val('rb_note').trim(), img});
  await save(); closeModal(); render(); toast('Top-up saved');
}
function rlMargin(p) { $('#' + p + '_m').textContent = 'Margin: ' + money((+val(p + '_amt') || 0) - (+val(p + '_cost') || 0)); }
function openRlSale() {
  if (!state.rl.cos.length) { toast('Add a reload company first'); return openCompany(); }
  openModal(`<h3>Reload sale</h3><div class="f"><div><label>Company</label><select id="rs_co">${coOpts()}</select></div><div><label>Date</label><input id="rs_date" type="date" value="${todayStr()}"></div>
    <div><label>Reload value (leaves company balance)</label><input id="rs_cost" type="number" min="0" step="0.01" oninput="rlMargin('rs')"></div>
    <div><label>Amount customer pays / owes</label><input id="rs_amt" type="number" min="0" step="0.01" oninput="rlMargin('rs')"></div>
    <div class="total"><span id="rs_m">Margin: ${money(0)}</span></div>
    ${payBlock('rs', 'sale')}<div class="full"><label>Phone number</label><input id="rs_num" inputmode="tel" placeholder="Optional"></div></div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn teal" onclick="saveRlSale()">Save sale</button></div>`);
}
async function saveRlSale() {
  const c = state.rl.cos.find(x => x.id === val('rs_co')), cost = +val('rs_cost') || 0, amount = +val('rs_amt') || 0, pay = val('rs_pay'), party = val('rs_party').trim();
  if (!(cost > 0) || !(amount > 0)) return toast('Enter both amounts');
  if (pay === 'credit' && !party) return toast('Enter the customer name for credit');
  const left = rlBal(c); if (cost > left + 0.005) return toast(`Only ${money(left)} left in ${c.name}`);
  state.rl.sells.push({id: uid(), date: val('rs_date') || todayStr(), co: c.id, amount, cost, number: val('rs_num').trim(), pay, party: pay === 'credit' ? party : ''});
  await save(); closeModal(); render(); toast('Reload sale saved');
}
function openRlEdit(id) {
  const x = state.rl.sells.find(a => a.id === id);
  openModal(`<h3>Edit reload sale</h3><p style="margin:-6px 0 12px;font-weight:700;color:var(--muted)">${esc(coName(x.co))}${x.party ? ' · ' + esc(x.party) : ''}</p><div class="f"><div><label>Date</label><input id="re_date" type="date" value="${x.date}"></div><div><label>Phone number</label><input id="re_num" value="${esc(x.number)}"></div>
    <div><label>Reload value (company)</label><input id="re_cost" type="number" min="0" step="0.01" value="${x.cost}" oninput="rlMargin('re')"></div>
    <div><label>Customer pays / owes</label><input id="re_amt" type="number" min="0" step="0.01" value="${x.amount}" oninput="rlMargin('re')"></div>
    <div class="total"><span id="re_m">Margin: ${money(x.amount - x.cost)}</span></div></div>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveRlEdit('${id}')">Save changes</button></div>`);
}
async function saveRlEdit(id) {
  const x = state.rl.sells.find(a => a.id === id), cost = +val('re_cost') || 0, amount = +val('re_amt') || 0;
  if (!(cost > 0) || !(amount > 0)) return toast('Enter both amounts');
  if (x.pay === 'credit' && amount < settledFor(id) - 0.005) return toast('Customer already paid ' + money(settledFor(id)) + ', which is more than this amount');
  const c = state.rl.cos.find(k => k.id === x.co); if (cost - x.cost > rlBal(c) + 0.005) return toast(`Only ${money(rlBal(c))} left in ${c.name}`);
  if (!await askPw('Save changes to this reload sale?', 'Save')) return;
  Object.assign(x, {cost, amount, date: val('re_date') || x.date, number: val('re_num').trim()});
  await save(); closeModal(); render(); toast('Sale updated');
}
async function delRl(kind, id) {
  if (!await askPw('Delete this reload entry?', 'Delete')) return;
  state.rl[kind] = state.rl[kind].filter(x => x.id !== id); state.settle = state.settle.filter(t => t.ref !== id); await save(); render();
}

const jOpts = () => accounts().map(a => `<option value="${esc(a.id)}">${a.code} · ${esc(a.name)}</option>`).join('');
function jRefresh() { document.querySelectorAll('#jl .jrow select').forEach(sel => { const v = sel.value; sel.innerHTML = jOpts(); sel.value = v; }); }
async function applyRename(id, name) {
  const f = FIXED.find(x => x.id === id), cu = state.custom.find(x => x.id === id), n = (name || '').trim();
  if (!f && !cu) return String(id).startsWith('rl:') ? 'Rename reload companies in the Reload tab' : 'Expense ledgers are named by their expense category';
  if (n && accounts().some(x => x.id !== id && x.name.toLowerCase() === n.toLowerCase())) return 'Another ledger already has that name';
  if (cu) { if (!n) return 'Enter a name'; cu.name = n; }
  else { state.names = state.names || {}; if (n && n !== f.def) state.names[id] = n; else delete state.names[id]; }
  await save(); render(); return '';
}
async function jRename(btn) {
  const sel = btn.closest('.jrow').querySelector('select'), a = acctById(sel.value);
  const n = prompt('New name for this ledger', a.name); if (n === null) return;
  const err = await applyRename(sel.value, n); if (err) return toast(err);
  jRefresh(); jCalc(); toast('Ledger renamed');
}
async function jNew() {
  const n = val('jn_name').trim(); if (!n) return toast('Type the new ledger name');
  if (accounts().some(x => x.name.toLowerCase() === n.toLowerCase())) return toast('Another ledger already has that name');
  state.custom.push({id: 'c:' + uid(), name: n, type: val('jn_type')}); await save();
  $('#jn_name').value = ''; jRefresh(); toast('Ledger added. Pick it in any line.');
}
function renameAcct(id) {
  const f = FIXED.find(x => x.id === id), cu = state.custom.find(x => x.id === id), a = f || cu;
  if (!a) return toast(String(id).startsWith('rl:') ? 'Rename reload companies in the Reload tab' : 'Expense ledgers are named by their expense category');
  openModal(`<h3>Rename ledger</h3><div class="f"><div class="full"><label>Ledger name</label><input id="rn_name" value="${esc(a.name)}"></div></div>
    <p style="margin-top:10px;font-size:13px;color:var(--muted);font-weight:700">${f ? 'Original name: ' + esc(a.def) + '. ' : ''}Only the name changes. All entries stay.</p>
    <div class="mfoot"><button class="btn ghost" onclick="closeModal()">Cancel</button>${f ? `<button class="btn ghost" onclick="saveRename('${id}',true)">Reset name</button>` : ''}<button class="btn" onclick="saveRename('${id}')">Save</button></div>`);
}
async function saveRename(id, reset) { const err = await applyRename(id, reset ? '' : val('rn_name')); if (err) return toast(err); closeModal(); }

/* ---------- delete password ---------- */
function askPw(msg, okLabel = 'Confirm') {
  return new Promise(res => {
    const o = document.createElement('div'); o.className = 'overlay'; o.style.zIndex = 80;
    o.innerHTML = `<div class="modal" style="width:min(420px,100%)"><div class="hd"></div><h3>🔒 Password needed</h3>
      <p style="font-weight:700;color:var(--muted);margin-bottom:12px">${esc(msg)}</p>
      <div class="f"><div class="full"><label>Password</label><input id="pw_in" type="password" autocomplete="off" placeholder="Enter password"></div></div>
      <div id="pw_err" class="bad" style="display:none">Wrong password. Nothing was changed.</div>
      <div class="mfoot"><button class="btn ghost" id="pw_no">Cancel</button><button class="btn red" id="pw_ok">${esc(okLabel)}</button></div></div>`;
    document.body.appendChild(o);
    const inp = o.querySelector('#pw_in'); inp.focus();
    const done = v => { o.remove(); res(v); };
    const check = () => {
      if (inp.value === (state.settings.delPw || 'Trust')) done(true);
      else { o.querySelector('#pw_err').style.display = ''; inp.value = ''; inp.focus(); }
    };
    o.querySelector('#pw_ok').onclick = check; o.querySelector('#pw_no').onclick = () => done(false);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter') check(); if (e.key === 'Escape') done(false); });
  });
}

/* ---------- settings, export, backup ---------- */
function openSettings() {
  openModal(`<h3>Settings</h3><div class="f">
    <div class="full"><label>Shop name</label><input id="st_shop" value="${esc(state.settings.shop)}"></div>
    <div><label>Currency symbol</label><input id="st_cur" value="${esc(state.settings.currency)}" maxlength="6"></div>
    <div><label>Low stock warning at</label><input id="st_low" type="number" min="0" value="${state.settings.lowStock}"></div>
    <div class="full"><label>New delete password (leave blank to keep the current one)</label><input id="st_pw" type="password" autocomplete="new-password"></div>
  </div><div class="mfoot"><button class="btn red" onclick="resetAll()">Erase all data</button><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" onclick="saveSettings()">Save</button></div>`);
}
async function saveSettings() {
  const np = val('st_pw').trim();
  if (np && !await askPw('Enter the current password to set a new one')) return;
  state.settings = {shop: val('st_shop').trim() || 'Future Mobile Diyawiddagama', currency: val('st_cur').trim() || 'Rs.', lowStock: Math.max(0, parseInt(val('st_low')) || 0), delPw: np || state.settings.delPw || 'Trust'};
  await save(); closeModal(); render();
}
async function resetAll() {
  if (!await askPw('Erase ALL items, income, expenses and bill photos? This cannot be undone.', 'Erase all')) return;
  if (!confirm('Last check: have you downloaded a backup?')) return;
  for (const id of Object.keys(imgCache)) delete imgCache[id];
  if (db) { await idb('img', 'readwrite', s => s.clear()); }
  state = {products: [], sales: [], expenses: [], settle: [], journal: [], rl: {cos: [], buys: [], sells: []}, names: state.names, custom: state.custom, settings: state.settings}; await save(); closeModal(); render();
}
function download(name, blob) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); }
const csvCell = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
function exportCSV(kind) {
  const rows = kind === 'sales'
    ? [['Date', 'Type', 'Item', 'Qty', 'Unit price', 'Total', 'Cost', 'Note'], ...state.sales.map(s => [s.date, s.type, s.name, s.qty, s.unit, s.total, s.cost, s.note])]
    : [['Date', 'Title', 'Category', 'Qty', 'Unit price', 'Total', 'Note'], ...state.expenses.map(e => [e.date, e.title, e.category, e.qty, e.unit, e.amount, e.note])];
  download(`phone-shop-${kind}-${todayStr()}.csv`, new Blob(['\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\n')], {type: 'text/csv'}));
}
function exportStockCSV() {
  const rows = [['SKU', 'Name', 'Category', 'Qty', 'Cost', 'Sell price', 'Date added'], ...state.products.map(p => [p.sku, p.name, p.category, p.qty, p.cost, p.price, p.date])];
  download(`phone-shop-stock-${todayStr()}.csv`, new Blob(['\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\n')], {type: 'text/csv'}));
}
async function exportBackup() {
  const ids = new Set([...state.products, ...state.sales, ...state.expenses, ...state.rl.buys].map(x => x.img).filter(Boolean)), images = {};
  for (const id of ids) images[id] = await getImg(id);
  download(`phone-shop-backup-${todayStr()}.json`, new Blob([JSON.stringify({version: 1, state, images})], {type: 'application/json'}));
  toast('Backup downloaded');
}
$('#restoreFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const d = JSON.parse(await f.text()); if (!d.state) throw 0;
    if (!await askPw('Replace everything in the app with this backup?', 'Restore')) return;
    state = d.state; state.names = state.names || {}; state.custom = state.custom || []; state.rl = state.rl || {cos: [], buys: [], sells: []}; state.settle = state.settle || []; state.journal = state.journal || []; for (const [id, v] of Object.entries(d.images || {})) { imgCache[id] = v; await idbSet('img', id, v); }
    await save(); render(); toast('Backup restored');
  } catch (err) { toast('That file is not a valid backup'); }
  e.target.value = '';
});

/* ---------- start ---------- */
(async function init() {
  await openDB();
  const saved = await idbGet('kv', 'state');
  if (saved) state = Object.assign(state, saved, {settings: Object.assign(state.settings, saved.settings || {})});
  state.settle = state.settle || []; state.journal = state.journal || []; state.custom = state.custom || [];
  if (state.settings.shop === 'My Phone Shop') state.settings.shop = 'Future Mobile Diyawiddagama';
  render();
})();
</script>
</body>
</html>
